<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Regression Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #F5F0E8; --ink: #1a1a1a; --warn: #d33; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'IBM Plex Mono', monospace; background: var(--paper); color: var(--ink); padding: 2rem 1rem; }
        h1 { font-family: 'Space Grotesk', sans-serif; text-transform: uppercase; font-size: 2rem; }
        .bar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1rem 0 1.5rem;
               padding-bottom: 1rem; border-bottom: 2px solid var(--ink); font-size: 0.8rem; font-weight: 600; }
        .bar select, .bar input, .bar button { font: inherit; border: 2px solid var(--ink); background: transparent; padding: 0.2rem 0.5rem; }
        .bar button { cursor: pointer; text-transform: uppercase; }
        .bar button:hover { background: var(--ink); color: var(--paper); }
        .hint { opacity: 0.6; font-size: 0.75rem; margin-left: auto; }
        #drop { border: 2px dotted var(--ink); padding: 1rem; text-align: center; font-size: 0.8rem; margin-bottom: 1.5rem; }
        #drop.over { background: rgba(0,0,0,0.06); }
        .row { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 1rem; padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.15); }
        .row canvas, .row .err { width: 160px; height: 128px; object-fit: contain; background: #ddd; display: block; }
        .row .err { font-size: 0.7rem; padding: 0.5rem; color: var(--warn); }
        .name { font-weight: 600; font-size: 0.8rem; margin-bottom: 0.4rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .tag { border: 1px solid currentColor; padding: 0 0.3rem; font-size: 0.7rem; }
        .tag.changed { color: var(--warn); }
        .tag.better { color: #1e8a4c; }
        .strip { display: flex; height: 52px; border: 2px solid var(--ink); }
        .strip.baseline { height: 28px; margin-top: 0.4rem; opacity: 0.75; }
        .sw { flex: 1; min-width: 0; padding: 3px 5px; font-size: 0.62rem; line-height: 1.3; overflow: hidden; white-space: nowrap; }
        .sw b { display: block; font-family: 'Space Grotesk', sans-serif; }
        .sw.diff { outline: 3px solid var(--warn); outline-offset: -3px; }
        @media (max-width: 560px) {
            .row { grid-template-columns: 1fr; }
            .row canvas, .row .err { width: 100%; }
            .hint { margin-left: 0; }
        }
    </style>
</head>
<body>
    <h1>Regression Gallery</h1>
    <div class="bar">
        <label>K <select id="k"></select></label>
        <label>SEED <input id="seed" type="number" value="1" min="1" style="width:5em"></label>
        <button id="save-baseline">Save as baseline</button>
        <button id="clear-baseline">Clear baseline</button>
        <span class="hint">Hover a swatch for its score terms · thin strip = baseline · red outline = role changed · ERR ▲ = worse fit</span>
    </div>
    <div id="drop">DROP IMAGES HERE TO ADD THEM FOR THIS SESSION · PERMANENT SET: regression/list.js (serve over http)</div>
    <div id="rows"></div>

    <script src="color.js"></script>
    <script src="regression/list.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
