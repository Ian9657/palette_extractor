# Run the colour and proof unit tests on every push to main.
# Node's built-in runner needs no install; Playwright is only for the local browser tools.
name: Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
